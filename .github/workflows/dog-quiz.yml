name: Fetch dog breeds

# Manual only: hitting Wikidata and downloading ~500 photos is not something
# that should happen on every push.
on:
  workflow_dispatch:
    inputs:
      max_breeds:
        description: "How many breeds to collect (blank uses the script's own MAX_BREEDS)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dog-quiz
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only override the script's own MAX_BREEDS when a number was actually
      # typed -- a default here silently outranks the constant in the file.
      - name: Collect breeds and photos
        env:
          MAX_BREEDS_INPUT: ${{ inputs.max_breeds }}
        run: |
          if [ -n "$MAX_BREEDS_INPUT" ]; then
            sed -i "s/^MAX_BREEDS = .*/MAX_BREEDS = $MAX_BREEDS_INPUT/" scripts/fetch.py
            echo "Overriding MAX_BREEDS with $MAX_BREEDS_INPUT"
          fi
          grep "^MAX_BREEDS" scripts/fetch.py
          python3 scripts/fetch.py
          git checkout -- scripts/fetch.py

      - name: Summarise the run
        run: |
          {
            echo "### Dog breed data"
            echo ""
            echo "Breeds in breeds.json: **$(python3 -c 'import json;print(len(json.load(open("breeds.json"))))')**"
            echo "Photos downloaded: **$(find images -type f | wc -l)**"
            echo ""
            echo "Play at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/quiz/"
            echo ""
            if [ -s failed.log ]; then
              echo "Breeds that failed or came back empty:"
              echo ""
              sed 's/^/- /' failed.log
            else
              echo "No failures."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Committing to the published branch is all that is needed: GitHub Pages
      # already builds this repository's root, so the new files go live on their
      # own and the existing pricing calculator at / is left untouched.
      - name: Commit the dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images breeds.json
          if git diff --staged --quiet; then
            echo "Dataset unchanged."
          else
            git commit -m "Update dog breed dataset"
            git push
          fi
