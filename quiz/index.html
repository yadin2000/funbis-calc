<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>חידון גזעי כלבים</title>
<style>
  :root {
    --bg: #fff9ec;
    --card: #ffffff;
    --ink: #2f2a24;
    --muted: #7d7266;
    --accent: #ff9800;
    --correct: #2e9e5b;
    --wrong: #d64545;
    --line: #ecdfc8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.25rem; margin: 0; color: var(--accent); }
  .score { font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.3s ease; }

  /* The whole photo has to be visible -- cropping to fill the frame used to
     cut the dog out of shots where it is not dead centre. The picture is
     letterboxed instead, over a blurred copy of itself so the box still
     looks filled and the layout does not jump between questions. */
  .photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    /* On a short screen the frame gives way rather than pushing the answers
       off the bottom -- nothing is cropped either way. */
    max-height: 50vh;
    background: #f0e6d6;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .photo .backdrop {
    position: absolute;
    inset: 0;
    background: center/cover no-repeat;
    filter: blur(22px) saturate(1.2);
    transform: scale(1.15);
    opacity: 0.55;
  }
  .photo img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @media (min-width: 480px) {
    .photo { aspect-ratio: 3 / 2; }
  }
  .photo .spinner {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); font-size: 0.9rem;
  }

  .options { display: grid; gap: 10px; margin-top: 14px; }
  button.opt {
    width: 100%;
    padding: 15px 16px;
    font-size: 1.05rem;
    font-family: inherit;
    text-align: right;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  button.opt:active { transform: scale(0.99); }
  button.opt[disabled] { cursor: default; }
  button.opt.correct { border-color: var(--correct); background: #eaf7ef; color: #1d6b3c; font-weight: 700; }
  button.opt.wrong { border-color: var(--wrong); background: #fdeeee; color: #a52f2f; }

  .feedback { margin-top: 14px; min-height: 24px; font-size: 0.95rem; color: var(--muted); }
  .feedback b { color: var(--ink); }

  .primary {
    margin-top: 12px;
    width: 100%;
    padding: 15px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .hidden { display: none !important; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
  button.level {
    position: relative;
    padding: 14px 8px 12px;
    font-family: inherit;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    color: var(--ink);
  }
  button.level .n { display: block; font-size: 1.3rem; font-weight: 800; }
  button.level .stars { display: block; font-size: 0.8rem; margin-top: 3px; min-height: 1em; color: var(--accent); }
  button.level.locked { opacity: 0.45; cursor: not-allowed; background: transparent; }
  button.level.cleared { border-color: var(--correct); background: #f2faf5; }
  button.level.current { border-color: var(--accent); box-shadow: 0 0 0 3px #ffe9c4; }

  .lead { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin: 2px 0 14px; }
  .difficulty { font-size: 0.85rem; color: var(--muted); }
  .backlink {
    display: inline-block; margin-top: 16px; padding: 10px 14px;
    font-family: inherit; font-size: 0.95rem;
    background: none; border: 2px solid var(--line); border-radius: 10px;
    color: var(--muted); cursor: pointer;
  }

  .end { text-align: center; padding: 28px 16px; }
  .end .big { font-size: 2.6rem; font-weight: 800; color: var(--accent); margin: 6px 0; }
  .note { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
  .note code {
    background: #f3ead9; padding: 2px 6px; border-radius: 4px;
    font-size: 0.85em; direction: ltr; display: inline-block;
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="note" style="text-align:center; padding:40px 0;">טוען…</div>

  <div id="error" class="hidden note" style="padding:24px 0;"></div>

  <div id="map" class="hidden">
    <header>
      <h1>איזה גזע זה?</h1>
      <div class="score" id="mapProgress"></div>
    </header>
    <p class="lead">15 שלבים, מהגזעים המוכרים ביותר עד הנדירים. כל שלב פותח את הבא אחריו.</p>
    <div class="levels" id="levels"></div>
    <p class="lead" id="mapNote" style="margin-top:16px"></p>
  </div>

  <div id="game" class="hidden">
    <header>
      <h1 id="levelTitle">שלב 1</h1>
      <div class="score"><span id="qnum">1</span>/<span id="qtotal">5</span> · ניקוד <span id="points">0</span></div>
    </header>
    <div class="bar"><i id="progress"></i></div>

    <div class="photo">
      <div class="backdrop" id="backdrop"></div>
      <div class="spinner" id="spinner">טוען תמונה…</div>
      <img id="photo" alt="תמונת כלב" hidden>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="next">השאלה הבאה</button>
  </div>

  <div id="end" class="hidden end">
    <div class="note" id="endTitle"></div>
    <div class="big"><span id="finalScore">0</span>/<span id="finalTotal">5</span></div>
    <div class="note" id="verdict"></div>
    <button class="primary" id="again">שחק שוב את השלב</button>
    <button class="backlink" id="toMap">חזרה למפת השלבים</button>
  </div>

</div>

<script>
const LEVEL_COUNT = 15;
const QUESTIONS_PER_LEVEL = 5;
const OPTION_COUNT = 4;
const PASS_MARK = 3;            // out of QUESTIONS_PER_LEVEL, to unlock the next
const STORE_KEY = "dogQuizProgress";
// The dataset sits at the repository root; this page is served from /quiz/.
const DATA_ROOT = "../";

let levels = [];                // array of breed arrays, easiest level first
let progress = { cleared: {} }; // level index -> best score
let level = 0;
let round = [];
let index = 0;
let points = 0;

const $ = (id) => document.getElementById(id);

function shuffle(list) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function pick(list, n) {
  return shuffle(list).slice(0, n);
}

/* Progress is a nicety, not the source of truth -- a browser that refuses
   storage still plays, it just always starts at the first level. */
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) progress = JSON.parse(raw) || { cleared: {} };
  } catch (err) { /* private mode, blocked storage */ }
  if (!progress || typeof progress !== "object") progress = { cleared: {} };
  if (!progress.cleared) progress.cleared = {};
}

function saveProgress() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (err) { /* ignore */ }
}

function unlocked(i) {
  return i === 0 || progress.cleared[i - 1] >= PASS_MARK;
}

/* Wikidata sitelink counts rank the breeds from famous to obscure. Slicing
   that order into bands gives levels that genuinely get harder, and because
   the bands do not overlap, one playthrough never asks about the same breed
   twice. */
function buildLevels(breeds) {
  const ranked = breeds.slice().sort((a, b) => (b.sitelinks || 0) - (a.sitelinks || 0));
  const wanted = Math.min(LEVEL_COUNT, Math.floor(ranked.length / OPTION_COUNT));
  if (wanted < 1) return [];
  const size = Math.floor(ranked.length / wanted);
  const out = [];
  for (let i = 0; i < wanted; i++) {
    out.push(i === wanted - 1 ? ranked.slice(i * size) : ranked.slice(i * size, (i + 1) * size));
  }
  return out;
}

function showError(html) {
  $("loading").classList.add("hidden");
  $("error").classList.remove("hidden");
  $("error").innerHTML = html;
}

async function load() {
  let data;
  try {
    const response = await fetch(DATA_ROOT + "breeds.json", { cache: "no-cache" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    data = await response.json();
  } catch (err) {
    showError(
      "<b>לא נמצא קובץ הנתונים.</b><br><br>" +
      "צריך להריץ קודם את שלב איסוף הנתונים — ב-GitHub, בלשונית Actions, " +
      "מריצים את <code>Fetch dog breeds</code>.<br><br>" +
      "<span style='opacity:.7'>(" + err.message + ")</span>"
    );
    return;
  }

  const breeds = (Array.isArray(data) ? data : []).filter(
    (b) => b && b.name_he && Array.isArray(b.images) && b.images.length > 0
  );
  levels = buildLevels(breeds);

  if (!levels.length) {
    showError(
      "<b>אין מספיק גזעים כדי לשחק.</b><br><br>נמצאו " + breeds.length +
      " גזעים עם תמונות, וצריך לפחות " + OPTION_COUNT + ". " +
      "כדאי להריץ שוב את איסוף הנתונים."
    );
    return;
  }

  loadProgress();
  $("loading").classList.add("hidden");
  showMap();
}

function stars(score) {
  if (score === undefined) return "";
  if (score >= QUESTIONS_PER_LEVEL) return "★★★";
  if (score >= PASS_MARK + 1) return "★★";
  if (score >= PASS_MARK) return "★";
  return "";
}

function showMap() {
  $("game").classList.add("hidden");
  $("end").classList.add("hidden");
  $("map").classList.remove("hidden");

  const cleared = levels.filter((_, i) => progress.cleared[i] >= PASS_MARK).length;
  $("mapProgress").textContent = cleared + "/" + levels.length + " שלבים";
  $("mapNote").textContent =
    "הקושי נקבע לפי כמה הגזע מתועד בוויקיפדיה — בשלב 1 הגזעים המוכרים בעולם, " +
    "ובשלבים הגבוהים גזעים נדירים. אותו גזע לא חוזר בין שלבים.";

  const box = $("levels");
  box.innerHTML = "";
  levels.forEach((pool, i) => {
    const open = unlocked(i);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "level" + (open ? "" : " locked")
      + (progress.cleared[i] >= PASS_MARK ? " cleared" : "")
      + (open && progress.cleared[i] === undefined ? " current" : "");
    button.innerHTML = '<span class="n">' + (open ? (i + 1) : "🔒") + "</span>"
      + '<span class="stars">' + stars(progress.cleared[i]) + "</span>";
    button.disabled = !open;
    if (open) button.onclick = () => startLevel(i);
    box.appendChild(button);
  });
}

function startLevel(i) {
  level = i;
  round = pick(levels[i], Math.min(QUESTIONS_PER_LEVEL, levels[i].length));
  index = 0;
  points = 0;
  $("map").classList.add("hidden");
  $("end").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("qtotal").textContent = round.length;
  $("levelTitle").textContent = "שלב " + (i + 1);
  showQuestion();
}

function showQuestion() {
  const breed = round[index];
  // Distractors come from the same level, so a famous name never gives itself
  // away among obscure ones.
  const pool = levels[level].filter((b) => b.slug !== breed.slug);
  const others = pick(pool, OPTION_COUNT - 1);
  const choices = shuffle([breed, ...others]);

  $("qnum").textContent = index + 1;
  $("points").textContent = points;
  $("progress").style.width = (index / round.length) * 100 + "%";
  $("feedback").textContent = "";
  $("next").classList.add("hidden");

  const img = $("photo");
  const backdrop = $("backdrop");
  img.hidden = true;
  backdrop.style.backgroundImage = "";
  $("spinner").style.display = "grid";
  $("spinner").textContent = "טוען תמונה…";
  img.onload = () => {
    img.hidden = false;
    $("spinner").style.display = "none";
    backdrop.style.backgroundImage = 'url("' + img.src + '")';
  };
  img.onerror = () => { $("spinner").textContent = "התמונה לא נטענה"; };
  img.src = DATA_ROOT + breed.images[Math.floor(Math.random() * breed.images.length)];

  const box = $("options");
  box.innerHTML = "";
  choices.forEach((choice) => {
    const button = document.createElement("button");
    button.className = "opt";
    button.type = "button";
    button.textContent = choice.name_he;
    button.onclick = () => answer(button, choice, breed);
    box.appendChild(button);
  });
}

function answer(button, choice, breed) {
  const buttons = [...$("options").querySelectorAll("button")];
  buttons.forEach((b) => { b.disabled = true; });

  const right = choice.slug === breed.slug;
  if (right) {
    points++;
    button.classList.add("correct");
    $("feedback").innerHTML = "נכון! <b>" + breed.name_he + "</b> — " + breed.name_en;
  } else {
    button.classList.add("wrong");
    buttons.find((b) => b.textContent === breed.name_he)?.classList.add("correct");
    $("feedback").innerHTML = "לא — זה <b>" + breed.name_he + "</b> (" + breed.name_en + ")";
  }

  $("points").textContent = points;
  $("next").textContent = index + 1 >= round.length ? "לסיכום" : "השאלה הבאה";
  $("next").classList.remove("hidden");
}

$("next").onclick = () => {
  index++;
  if (index >= round.length) return finish();
  showQuestion();
};

$("again").onclick = () => startLevel(level);
$("toMap").onclick = showMap;

function finish() {
  if (points > (progress.cleared[level] || 0)) {
    progress.cleared[level] = points;
    saveProgress();
  }

  $("game").classList.add("hidden");
  $("end").classList.remove("hidden");
  $("finalScore").textContent = points;
  $("finalTotal").textContent = round.length;

  const passed = points >= PASS_MARK;
  const last = level + 1 >= levels.length;
  $("endTitle").textContent = "שלב " + (level + 1) + (passed ? " הושלם" : " לא הושלם");
  $("verdict").textContent =
    !passed ? "צריך " + PASS_MARK + " תשובות נכונות כדי לפתוח את השלב הבא." :
    last ? "סיימת את כל השלבים. אתה מומחה כלבים." :
    "שלב " + (level + 2) + " נפתח.";
}

load();
</script>
</body>
</html>
